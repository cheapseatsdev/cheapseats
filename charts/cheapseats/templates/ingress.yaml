{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}{{ fail "ingress.host is required when ingress is enabled" }}{{ end }}
{{- if and (not .Values.ingress.tls) (not .Values.ingress.externalTLS) }}{{ fail "ingress.tls is required when ingress is enabled: bearer tokens and sign-in headers must not cross the network in plain HTTP. If TLS ends before this Ingress (a load balancer or CDN in front), set ingress.externalTLS: true" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cheapseats.fullname" . }}
  labels: {{- include "cheapseats.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cheapseats.fullname" . }}
                port:
                  name: http
{{- end }}
