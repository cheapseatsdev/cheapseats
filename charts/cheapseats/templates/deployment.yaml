{{- if not .Values.image.repository }}{{ fail "image.repository is required: your Cheap Seats image, with your config in /config" }}{{ end }}
{{- if not .Values.image.tag }}{{ fail "image.tag is required: deploy an exact tag" }}{{ end }}
{{- if not .Values.existingSecret }}{{ fail "existingSecret is required: a Secret with CHEAPSEATS_TOKENS and ANTHROPIC_API_KEY" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cheapseats.fullname" . }}
  labels: {{- include "cheapseats.labels" . | nindent 4 }}
spec:
  # One instance on one SQLite volume: never two at once, so replace instead of rolling.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "cheapseats.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cheapseats.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cheapseats
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "-addr", "0.0.0.0:3000"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: CHEAPSEATS_DATA_DIR
              value: /data
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # /healthz needs no token. Startup migrates the database first, so give it time.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cheapseats.claim" . }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
