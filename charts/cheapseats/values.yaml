# Your deployment's image: ghcr.io/cheapseatsdev/cheapseats with your config repo copied to /config (see
# docs/deploying.md). The plain app image works too, with the config mounted at /config by
# extraVolumes and extraVolumeMounts.
image:
  repository: ""   # required, e.g. ghcr.io/acme/cheapseats-config
  tag: ""          # required: deploy an exact tag, so a rollback is redeploying the previous one
  pullPolicy: IfNotPresent
imagePullSecrets: []   # e.g. [{name: ghcr}] for a private registry

# The chart's name in resource names and labels, when it must differ from "cheapseats". Changing
# it on an installed release renames its Deployment and data volume, which starts on an empty disk.
nameOverride: ""

# Secrets never go in values: the chart fails on a value that looks like one. They reach the pod
# from Secrets you create, in one of two ways.
#
# 1. existingSecret (required): a Secret whose keys are environment variables, loaded whole:
#    CHEAPSEATS_TOKENS (required: Cheap Seats listens beyond localhost here), ANTHROPIC_API_KEY
#    (required: grading), OPENAI_API_KEY if an answerer uses it, and the optional providers'
#    TYPESAFE_API_KEY and EXA_API_KEY if the config has [typesafe] or [exa].
#      kubectl create secret generic cheapseats --from-literal=CHEAPSEATS_TOKENS=... --from-literal=ANTHROPIC_API_KEY=...
existingSecret: ""
# 2. Or pick single keys out of any Secrets (or ConfigMaps) with ordinary EnvVar and EnvFromSource
#    entries, passed through as written:
#      extraEnv:
#        - name: TYPESAFE_API_KEY
#          valueFrom: {secretKeyRef: {name: provider-keys, key: typesafe}}
#      extraEnvFrom:
#        - secretRef: {name: more-keys}
extraEnv: []
extraEnvFrom: []

# Plain environment, for values that are not secrets: CHEAPSEATS_CONFIG_REV when the config image
# doesn't set it, or the key-adding proxies that make a key unnecessary (exe.dev integrations):
# CHEAPSEATS_ANTHROPIC_BASE_URL, CHEAPSEATS_TYPESAFE_BASE_URL, CHEAPSEATS_EXA_BASE_URL.
# A name ending in _API_KEY, _TOKEN or _TOKENS here fails the install: put it in a Secret.
env: {}

# The database. Cheap Seats is one always-on instance on one volume: the chart runs a single replica
# and replaces it rather than rolling, so two never share the database.
persistence:
  size: 1Gi
  storageClass: ""   # the cluster default when empty
  existingClaim: ""  # use a PersistentVolumeClaim you manage instead of creating one

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []   # e.g. [{secretName: cheapseats-tls, hosts: [cheapseats.example.com]}]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi

# Cheap Seats marks runs in progress as interrupted on SIGTERM, to resume on the next start; this
# leaves it time to.
terminationGracePeriodSeconds: 30

extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
