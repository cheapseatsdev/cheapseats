id = "ai-search-visibility"
name = "Understanding and measuring AI visibility"
tier = "core"
description = """Marketers learning what AI visibility means and how to measure it. Most questions ask for methods or explanations and measure substantive named presence; only the explicit tool-discovery question contributes to recommendation rates. The questions include Google and other surfaces Cheap Seats does not measure, so their answers can expose a real coverage mismatch. Cheap Seats asks Claude and OpenAI models buyer questions, separates web search from recall, grades recommendations and builds a fix list. It does not establish that AI caused a traffic change."""

# Problem awareness: is AI search affecting us, and what is this category called?

[[prompts]]
id = "ai-search-hurting-organic-traffic"
text = "Our organic traffic is down and I suspect ChatGPT and Google AI Overviews. How do I check whether AI search is what's taking it?"
intent = "info"

[[prompts]]
id = "geo-aeo-llm-seo-difference"
text = "GEO, AEO, LLM SEO: what are they, how do they differ from SEO, and which should a B2B marketing team care about?"
intent = "info"

