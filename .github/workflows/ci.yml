name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each entry merged onto the queue ahead of it, under this event; a
  # workflow without it never reports, and the entry waits forever.
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: the example config passes its own checks
        run: CHEAPSEATS_CONFIG=examples/cheapseats-config/cheapseats.toml go run ./cmd/cheapseats check
      - name: scripts parse
        run: bash -n deploy/*.sh
