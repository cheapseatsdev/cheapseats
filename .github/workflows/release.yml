name: release

# Push a tag like v1.2.3 to release: the image goes to ghcr.io/<owner>/cheapseats:1.2.3 (and :1.2),
# the Helm chart to oci://ghcr.io/<owner>/charts/cheapseats at the same version, and a GitHub
# release is drafted from the commits since the last tag. Run it by hand to build without
# publishing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: version
        id: v
        run: |
          if [ "$PUBLISH" = true ]; then v=${GITHUB_REF_NAME}; else v=v0.0.0-dev; fi
          {
            echo "version=$v"
            echo "semver=${v#v}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cheapseats"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: chart
        run: |
          helm package charts/cheapseats --version "${{ steps.v.outputs.semver }}" --app-version "${{ steps.v.outputs.version }}" -d dist
          if [ "$PUBLISH" = true ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
            helm push dist/cheapseats-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          fi
      - name: draft the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes dist/cheapseats-*.tgz
