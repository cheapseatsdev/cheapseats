name: release

# Push a tag like v1.2.3 to release: the image goes to ghcr.io/<owner>/cheapseats:1.2.3 (and :1.2),
# the Helm chart to oci://ghcr.io/<owner>/charts/cheapseats at the same version, and a GitHub
# release is drafted from the commits since the last tag. Run it by hand to build without
# publishing.
#
# Publishing waits for the live schema check (schemas.yml): every structured output schema sent
# to the real API once, a few cents. It runs in the golden environment, so the release waits
# until one of its required reviewers approves. If the check fails, or is rejected or never
# approved, the release job fails before it builds and nothing is published.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  schemas:
    # Only a run that publishes needs it; a build by hand on a branch skips it.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/schemas.yml
    secrets: inherit
    permissions:
      contents: read

  release:
    needs: schemas
    # Runs when schemas passed or was skipped, and fails in its first step on a tag if schemas
    # didn't pass, so a blocked release is a red run that says why, not a skipped job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: the live schema check passed
        env:
          SCHEMAS: ${{ needs.schemas.result }}
        run: |
          if [ "$PUBLISH" = true ] && [ "$SCHEMAS" != success ]; then
            echo "::error::the live schema check (schemas.yml) did not pass ($SCHEMAS), so nothing is published. Re-run the failed jobs once it can pass (approval rejected or timed out, a transient API error); a schema the API refused needs a fix on main and a new tag."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: version
        id: v
        # The tag becomes an image tag, a chart version and a release name, so it must be plain
        # vMAJOR.MINOR.PATCH (no prerelease suffix, no leading zeros) before anything uses it.
        run: |
          if [ "$PUBLISH" = true ]; then
            v=$GITHUB_REF_NAME
            if ! [[ "$v" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::tag must look like v1.2.3"
              exit 1
            fi
          else
            v=v0.0.0-dev
          fi
          {
            echo "version=$v"
            echo "semver=${v#v}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cheapseats"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: chart
        env:
          SEMVER: ${{ steps.v.outputs.semver }}
          VERSION: ${{ steps.v.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          helm package charts/cheapseats --version "$SEMVER" --app-version "$VERSION" -d dist
          if [ "$PUBLISH" = true ]; then
            printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
            helm push dist/cheapseats-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          fi
      - name: draft the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes dist/cheapseats-*.tgz
