name: kubernetes

# Installs the chart on kind the way a client deploys, and checks it serves, keeps its data
# across restarts, upgrades, and rolls back a broken config. It runs on every pull request and
# merge-queue entry (the main ruleset requires it), on pushes to main that touch what it
# exercises, nightly, and by hand.
on:
  push:
    branches: [main]
    paths:
      - charts/**
      - deploy/kind-smoke.sh
      - Dockerfile
      - go.mod
      - .github/workflows/kubernetes.yml
  # Every pull request: the check is required by the main ruleset, and a required check that
  # does not run never passes, so a path filter here kept Go-only PRs out of the merge queue.
  # It runs beside the Go tests and takes about as long, so a PR waits no longer for it.
  pull_request:
  schedule:
    - cron: "0 9 * * *"   # 01:00 or 02:00 Pacific, every day
  workflow_dispatch:
  # The merge queue requires this check on every entry; a workflow without this event never
  # reports and the entry waits forever. Path filters don't apply here, so the queue runs the
  # smoke test on each merge, in parallel with the Go tests and about as long.
  merge_group:

permissions:
  contents: read

jobs:
  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
      - run: helm lint charts/cheapseats --set image.repository=x --set image.tag=y --set existingSecret=s
      - name: The chart refuses secrets in values and a plain-HTTP ingress
        run: |
          base="--set image.repository=x --set image.tag=y --set existingSecret=s"
          refuse() { if helm template t charts/cheapseats $base "$@" >/dev/null 2>&1; then echo "rendered, should have failed: $*"; exit 1; fi; }
          accept() { helm template t charts/cheapseats $base "$@" >/dev/null; }
          refuse --set env.OPENAI_API_KEY=sk-x
          refuse --set 'extraEnv[0].name=OPENAI_API_KEY' --set 'extraEnv[0].value=sk-x'
          refuse --set 'extraEnv[0].name=gh_token' --set 'extraEnv[0].value=x'
          accept --set 'extraEnv[0].name=OPENAI_API_KEY' --set 'extraEnv[0].valueFrom.secretKeyRef.name=k' --set 'extraEnv[0].valueFrom.secretKeyRef.key=o'
          accept --set 'extraEnv[0].name=CHEAPSEATS_DEBUG' --set 'extraEnv[0].value=1'
          refuse --set ingress.enabled=true --set ingress.host=h.example
          accept --set ingress.enabled=true --set ingress.host=h.example --set 'ingress.tls[0].secretName=t' --set 'ingress.tls[0].hosts[0]=h.example'
          accept --set ingress.enabled=true --set ingress.host=h.example --set ingress.externalTLS=true
      - run: deploy/kind-smoke.sh
