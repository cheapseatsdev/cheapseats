name: kubernetes

# Installs the chart on kind the way a client deploys, and checks it serves, keeps its data
# across restarts, upgrades, and rolls back a broken config. It runs on every pull request and
# merge-queue entry (the main ruleset requires it), on pushes to main that touch what it
# exercises, nightly, and by hand.
on:
  push:
    branches: [main]
    paths:
      - charts/**
      - deploy/kind-smoke.sh
      - Dockerfile
      - go.mod
      - .github/workflows/kubernetes.yml
  # Every pull request: the check is required by the main ruleset, and a required check that
  # does not run never passes, so a path filter here kept Go-only PRs out of the merge queue.
  # It runs beside the Go tests and takes about as long, so a PR waits no longer for it.
  pull_request:
  schedule:
    - cron: "0 9 * * *"   # 01:00 or 02:00 Pacific, every day
  workflow_dispatch:
  # The merge queue requires this check on every entry; a workflow without this event never
  # reports and the entry waits forever. Path filters don't apply here, so the queue runs the
  # smoke test on each merge, in parallel with the Go tests and about as long.
  merge_group:

permissions:
  contents: read

jobs:
  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: helm lint charts/cheapseats --set image.repository=x --set image.tag=y --set existingSecret=s
      - run: deploy/kind-smoke.sh
