# cheapseats configuration. Secrets (API keys, tokens) come from the environment or .env; see
# .env.example in the app repo. Prompt sets live in prompt-sets/ beside this file.
#
# This sample measures Cheap Seats itself. Copy the directory to start a config repo for your brand.

[brand]
name = "Cheap Seats"
aliases = ["CheapSeats", "cheapseats.dev", "cheapseatsdev/cheapseats"]
# What the product is, so the grader can tell it apart from other things called "cheapseats".
about = "Cheap Seats is an MIT-licensed, self-hosted tool that helps small teams and startups measure whether Claude and OpenAI models recommend their product and choose what to fix first."
# The market, as a noun phrase: what the prompts are about, where `about` says what this one
# product is. The prompt review's off-target check is asked against it ([typesafe]).
category = "AI visibility tools and starter workflows for small teams and startups measuring whether AI models recommend their product"
# Who asks the questions. The answerers are told they're answering this person's question.
# Changing `about` or `audience` changes how answers are asked or graded, so every trend restarts.
audience = "a founder or marketer at a small team or startup making its first AI visibility checks with limited time and budget"
# Public claims the analyst may build fixes on. Everything here is sent to the model.
facts = [
  "Cheap Seats is MIT licensed and runs as a single Docker container with a SQLite database.",
  "Prompt sets are TOML files in a git repo you own; changes go through pull requests.",
  "Answers come from Claude and OpenAI models through their APIs, or through local Claude Code and Codex CLIs on your own subscriptions.",
  "Each question is asked on two tracks: search, where the assistant must search the web first, and recall, with no tools, from what the model already believes.",
  "Each answer is graded recommended, mentioned or absent, with the brand's position, the top pick, every product named for share of voice, and the objections raised.",
  "Every run builds a ranked fix list: the exact page to create or change, what it must say, the prompts it should flip, which of the brand's sites it belongs on, and its owner.",
  "Rankings track each prompt set's share-of-voice rank and rates day by day, and every answer, search result and citation behind them is kept.",
  "Cheap Seats has a web UI, a CLI, a JSON API and an MCP server, and deploys with Docker, a Helm chart for Kubernetes, or on an exe.dev VM.",
  "An admission budget reserves estimated API spend before calls; settled costs can exceed reservations. Configured model and optional providers receive the inputs needed for their passes.",
]

# The brand's websites. Pages on them count as its own; the fix list puts each fix on the site that
# suits it and assigns it to that site's owner (else [owners]); each run shows which sites the
# answers drew on, including ones they never reached. A host covers its subdomains unless they're
# listed themselves; a host/path covers that prefix. kind: marketing | docs | blog | community |
# code | other. Adding or changing sites never restarts a trend.
[[brand.sites]]
url = "cheapseats.dev"
kind = "marketing"
# owner = "web team"

# A path is its own site: pages under cheapseats.dev/docs count as docs, the rest as marketing.
[[brand.sites]]
url = "cheapseats.dev/docs"
kind = "docs"
# owner = "docs team"

[[brand.sites]]
url = "cheapseats.dev/blog"
kind = "blog"

[[brand.sites]]
url = "github.com/cheapseatsdev/cheapseats"
kind = "code"

# Every assistant that answers. Results and rankings key on `id`: never reuse an id for a
# different model; add a new answerer instead. An answerer this machine can't call (no API key)
# is left out of the run and its comparisons.
#
# provider: anthropic | openai bill the API per token, and are what a deployed Cheap Seats uses.
# claude-code | codex run a local `claude` or `codex` CLI on its logged-in subscription, which
# only works on your own machine (the Docker image has neither; `cheapseats check` says so).
#
# samples: answers per prompt on each track, 0..20 (at least one in all).
#
# One flagship from each lab: they're trained differently, so they disagree in useful ways.
[[answerers]]
id = "claude-opus"
name = "Claude Opus"
provider = "anthropic"
model = "claude-opus-5-5"
samples = { search = 2, recall = 1 }

[[answerers]]
id = "chatgpt-sol"
name = "ChatGPT Sol"
provider = "openai"
model = "gpt-6.1-sol"
samples = { search = 2, recall = 1 }

# The same two through local subscriptions, for a laptop (cheapseats.subscriptions.toml beside this
# file is the whole config that way, with no API key):
# [[answerers]]
# id = "claude-code-opus"
# provider = "claude-code"
# model = "claude-opus-5-5"
# samples = { search = 2, recall = 1 }
#
# [[answerers]]
# id = "codex-sol"
# provider = "codex"
# model = "gpt-6.1-sol"
# samples = { search = 2, recall = 1 }

# Competitors the grader folds onto one canonical name in every prompt set, so share of voice counts
# "Peec" and "peec.ai" as Peec AI. A set can add its own [[competitors]], and its entry for the same
# name wins. Adding one is noted on the trend; it never restarts it. Domains are the competitor's
# own sites: the run page counts pages on them as the competitor's, and changing them changes no
# trend.
[[competitors]]
name = "Profound"
aliases = ["tryprofound", "Profound AI"]
domains = ["tryprofound.com"]

[[competitors]]
name = "Peec AI"
aliases = ["Peec", "peec.ai"]
domains = ["peec.ai"]

[[competitors]]
name = "Otterly.AI"
aliases = ["Otterly", "OtterlyAI"]
domains = ["otterly.ai"]

[[competitors]]
name = "Gauge"
aliases = ["withgauge", "withgauge.com"]
domains = ["withgauge.com"]

[[competitors]]
name = "Dageno AI"
aliases = ["Dageno", "dageno.ai"]
domains = ["dageno.ai"]

[[competitors]]
name = "AI Peekaboo"
aliases = ["Peekaboo", "aipeekaboo"]
domains = ["aipeekaboo.com"]

[[competitors]]
name = "Semrush AI Toolkit"
aliases = ["Semrush"]
domains = ["semrush.com"]

[[competitors]]
name = "Ahrefs Brand Radar"
aliases = ["Ahrefs"]
domains = ["ahrefs.com"]

[[competitors]]
name = "Frase"
aliases = ["frase.io", "Frase.io"]
domains = ["frase.io"]

# How the run page sorts the hosts answers draw on: own (the brand's sites), competitor (their
# domains), ugc, review, reference, institutional or editorial, from a built-in list. Put a host in
# another class here; it wins over the list.
# [sources]
# ugc = ["community.example.com"]
# editorial = ["medium.com"]

# The grader and the analyst go through the API. With provider = "claude-code" they run on the local
# claude CLI and your Claude subscription instead; with the subscription answerers above too, a
# laptop needs no API key at all. Switching it is a new method for every trend.
[grader]
model = "claude-haiku-5-5"
# provider = "claude-code"
# After each run, one more grader call groups its objections, praise and reasons for losing into
# a few named themes, shown on the run page. Under a cent a run at these prices; nothing on claude-code.
# themes = true

[analyst]
model = "claude-opus-5-5"
# provider = "claude-code"

[budget]
# Admission budget across every provider attempt. In-flight operations can exceed reservations.
daily_usd = 40.0
reservation_usd = 0.60
concurrency = 6   # provider calls at once, 1..64 (default 4)

# Adaptive sampling: before a core run, the prompts whose named rate has been least certain over the
# last 28 days (same method) are asked twice over, up to max_extra extra answers and within today's
# budget. Set max_extra to at least one prompt's answers (answerers x samples). Off by default;
# extras never change the method, so trends carry on.
# [sampling]
# adaptive = true
# max_extra = 12

[schedule]
# UTC hour for the daily runs. Leave unset on a dev machine so it doesn't spend money.
# daily_hour_utc = 13

# Starter questions run weekly; known-brand fit checks run every 28 days.
# Review after eight core runs and three fit runs; stopping is a manual config edit.
# How often the schedule runs each tier, in days. Both recall and search can vary between runs,
# even without a model release. Weekly runs can find gaps; a shorter interval provides more
# observations within a rolling window. Read uncertainty from completed comparable runs rather
# than treating cadence or repeated same-day samples as a precision guarantee.
[tiers.core]
every_days = 7

[tiers.plg]
every_days = 28
max_samples = 1   # 1..20

# Optional providers (docs/optional-providers.md); absent means off. [typesafe]: after each run,
# TypeSafe's Jev decides whether product names the grader wrote differently are one product, and
# the share-of-voice board folds them. [exa]: after each run, one Exa search per prompt over the
# brand's sites says which of your own pages answer it. Each needs its key (TYPESAFE_API_KEY,
# EXA_API_KEY) or a key-adding proxy (CHEAPSEATS_TYPESAFE_BASE_URL, CHEAPSEATS_EXA_BASE_URL), and
# its [pricing] entry below.
# [typesafe]         # TypeSafe's free tier (2026-10): $5 of usage a month, far more than folding uses.
# model = "jev-1.14.0"   # Keys: console.typesafe.ai/keys
# min_confidence = 0.7   # Jev's probability that two names are one product
#
# [exa]              # Exa's free plan (2026-10): $10 of credits a month, about 2,500 searches; weekly
# results = 3        # runs over a few hundred prompts stay inside it. Keys: dashboard.exa.ai
# prospect_seeds = 10    # prospects: cited listicles to find pages like (one search each), and how
# prospect_results = 5   # many to keep from each; pages no answer cited, as outreach

[owners]
# Who picks up each kind of fix. Unlisted gaps go to `default`. Leave blank until you name owners.
default = ""
# by_gap = { documentation = "", positioning = "", "third-party" = "", product = "" }

# USD per million tokens; search_per_1k is USD per 1,000 web searches.
# TODO: confirm against current price lists before relying on the cost figures.
[pricing.claude-opus-5-5]
input = 4.0
output = 20.0
cache_read = 0.20
cache_write = 5.0
search_per_1k = 10.0

[pricing.claude-sonnet-5-5]
input = 2.0
output = 10.0
cache_read = 0.20
cache_write = 2.5
search_per_1k = 10.0

[pricing.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125
search_per_1k = 10.0

# https://developers.openai.com/api/docs/models/gpt-6.1-sol (2026-10-20). Prompts over 272K
# input tokens cost more; ours are far below that.
[pricing."gpt-6.1-sol"]
input = 2.0
output = 10.0
cache_read = 0.10
search_per_1k = 10.0

# The optional providers (https://docs.typesafe.ai/models, https://exa.ai/pricing, 2026-10-23).
# Jev bills input only; an Exa search is priced per search and a page read through Exa (the
# [exa] contents_fallback, on by default) per page; Exa's own estimate is used when it returns one.
[pricing."jev-1.14.0"]
input = 0.042

[pricing.exa-search]
search_per_1k = 4.0

[pricing.exa-contents]
page_per_1k = 1.0
