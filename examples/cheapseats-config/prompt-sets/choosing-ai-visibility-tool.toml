id = "choosing-ai-visibility-tool"
name = "Getting started with AI visibility"
tier = "core"
description = """Small teams and startups deciding how to make their first useful AI visibility checks. Compare affordable tools with manual work, scripts and self-hosted options; test whether inspectable evidence and specific content guidance justify adopting a tool. Seven questions ask for choices; the cheap-start methods question measures named presence only. The audience need not have an engineer, existing subscriptions or a preference for self-hosting. Keep unfavorable answers when they reveal a real adoption obstacle. Review after eight weekly runs; retain only questions that still inform positioning, onboarding or a competitive decision."""

# Curated buying situations, not measured demand. Retained questions keep their IDs and text.
# Audience context comes from brand.audience; it does not assume technical capacity.

# Learn: which first-check route a startup is advised to take, including manual work.
# Action: show the actual entry cost and setup steps. A complete method can omit products.
[[prompts]]
id = "cheap-start-measuring-ai-visibility"
text = "What's a cheap way to start measuring AI visibility for a small startup?"
intent = "info"

# New buying question: explicit starter-tool selection, distinct from a cheap manual method.
# Action: address verified reasons a startup is directed to an alternative in the entry offer.
[[prompts]]
id = "starter-ai-visibility-tools-small-startup"
text = "Which AI visibility tools are a good starting point for a small startup with a limited budget?"

# New buying question: replacement for an existing manual routine, not just the lowest price.
# Action: demonstrate specific repeated work removed, or admit when a spreadsheet is sufficient.
[[prompts]]
id = "startup-tracker-alternatives-manual-spreadsheet"
text = "Which affordable AI visibility tools should a small startup consider instead of checking ChatGPT and Claude manually in a spreadsheet?"

# Learn: which projects enter the open-source consideration set and what objections recur.
# Action: clarify the value and operating effort of adopting maintained software.
[[prompts]]
id = "open-source-tools-measuring-ai"
text = "Are there open-source tools for measuring AI search visibility?"

# Learn: when a small API script is a better choice than an existing tracker.
# Action: show the grading, history and evidence work supplied, without dismissing DIY.
[[prompts]]
id = "build-own-ai-visibility-tracker"
text = "Should we build our own AI visibility tracker on the OpenAI and Anthropic APIs, or buy a tool?"

# Learn: practical installation expectations for the subset with engineering help.
# Action: fix evidenced setup friction. Review separately from open-source discovery;
# retire this probe if it adds no distinct deployment decision after eight weekly runs.
[[prompts]]
id = "self-hosted-ai-visibility-docker"
text = "Is there a self-hosted AI visibility tracker our engineering team can run in Docker?"

# Learn: which inspectable proof a skeptical team is told to require.
# Action: demonstrate a real answer, grade and citation; verify claims before changing copy.
[[prompts]]
id = "raw-answers-citations-behind-score"
text = "We want to inspect every raw AI answer and citation behind an AI visibility score. Which tools give us that?"

# Learn: whether specific work guidance earns consideration over another visibility score.
# Action: show a supported fix brief or address a concrete weakness in the suggested work.
[[prompts]]
id = "tools-say-what-content-create"
text = "Which AI visibility tools tell you what content to create or change, not just where you rank?"
