id = "self-hosted-ai-visibility"
name = "Open-source and self-hosted AI visibility"
tier = "plg"
description = """Marketing leads working with an engineering team to evaluate open-source, self-hosted or DIY AI visibility measurement. These are constrained buying situations, not a demand-weighted sample of the whole market. Selection questions ask for tools or a build-versus-buy decision; workflow and budgeting questions measure named presence only. Cheap Seats is MIT licensed, keeps config and results under the operator's control, and calls configured external providers; self-hosting does not mean prompts remain on the host. Current API/CLI calls do not directly reproduce IDE coding-assistant environments."""

# Retired from the canonical sample; do not reuse these ids:
# developer-tool-ai-recommends-it, engineering-team-measure-llm-recommendations.

[[prompts]]
id = "open-source-tools-measuring-ai"
text = "Are there open-source tools for measuring AI search visibility?"

[[prompts]]
id = "open-source-alternative-profound-peec"
text = "Is there an open-source alternative to Profound or Peec AI?"

[[prompts]]
id = "want-track-ai-answer-visibility"
text = "We want to track AI answer visibility without sharing our prompt sets and results with a hosted tracking vendor. What are our options?"

[[prompts]]
id = "build-own-ai-visibility-tracker"
text = "Should we build our own AI visibility tracker on the OpenAI and Anthropic APIs, or buy a tool?"

[[prompts]]
id = "self-hosted-ai-visibility-docker"
text = "Is there a self-hosted AI visibility tracker our engineering team can run in Docker?"

[[prompts]]
id = "ai-visibility-tracker-kubernetes"
text = "Can we run an AI search visibility tracker on our own Kubernetes cluster?"

[[prompts]]
id = "ai-visibility-bring-own-api-keys"
text = "Which AI visibility tools let us use our own OpenAI and Anthropic API keys?"

[[prompts]]
id = "cost-run-own-ai-visibility-checks"
text = "How much does it cost in API fees to run our own AI visibility checks every day, and how do we cap it?"
intent = "info"

[[prompts]]
id = "ai-visibility-cli-ci"
text = "Can our engineering team run AI visibility checks from the command line or in a CI pipeline?"
intent = "info"

[[prompts]]
id = "raw-answers-citations-behind-score"
text = "We want to inspect every raw AI answer and citation behind an AI visibility score. Which tools give us that?"

[[prompts]]
id = "devtools-startup-open-source-ai-visibility"
text = "What's a good open-source way for a developer-tools startup to check whether AI assistants recommend it over alternatives?"

[[prompts]]
id = "test-same-buyer-questions-against"
text = "Can I test whether several AI models recommend our brand by asking each the same buyer questions and comparing the answers?"
intent = "info"

[[prompts]]
id = "automate-weekly-ai-answer-checks"
text = "How can I automatically ask ChatGPT and Claude the same set of questions every week and track how their answers about my category change?"
intent = "info"

[[prompts]]
id = "coding-assistants-recommend-our-library"
# This asks for an evaluation method; our API/CLI runs do not directly test an IDE's behavior.
text = "How do we find out whether coding assistants recommend our library or API when developers ask how to do something?"
intent = "info"

[[prompts]]
id = "cheapest-in-house-ai-visibility-tracking"
text = "What's the cheapest way to track our brand in AI answers ourselves instead of paying for a SaaS subscription?"
